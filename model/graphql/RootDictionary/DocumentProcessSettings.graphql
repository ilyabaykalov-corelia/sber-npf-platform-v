mutation seedDocumentProcessSettings {
  dictionaryPacket {
    updateOrCreateDocumentProcessSettings(
      input: {
        id: "PDS_CONTRACT_PROCESS"
        documentType: "PDS_CONTRACT"
        processId: "Process_pds_contract_approval"
        enabled: true
      }
    ) {
      created
      returning {
        id
        documentType {
          id
          name
        }
        processId
        enabled
      }
    }
  }
}
